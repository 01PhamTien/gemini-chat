<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat với Gemini</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef2ff;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 760px;
      padding: 24px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px #24387818;
    }

    h1 { margin: 0 0 8px; }
    .subtitle { color: #64748b; }

    #chat {
      height: 52vh;
      overflow-y: auto;
      padding: 12px;
      background: #f8fafc;
      border-radius: 12px;
    }

    .message {
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .user {
      background: #e0e7ff;
      margin-left: 30px;
    }

    .assistant {
      background: #e5f6ee;
      margin-right: 30px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }
    #reset { background: #475569; }
    #status { min-height: 22px; color: #b91c1c; }
  </style>
</head>

<body>
  <main>
    <h1>✨ Chat với Gemini</h1>
    <p class="subtitle">Pham Van TIen ST23A</p>

    <div id="chat" aria-live="polite"></div>

    <form id="form">
      <input
        id="input"
        aria-label="Tin nhắn"
        placeholder="Nhập câu hỏi..."
        maxlength="12000"
        autocomplete="off"
        required
      >
      <button id="send" type="submit">Gửi</button>
    </form>

    <p id="status" role="status"></p>
    <button id="reset" type="button">Cuộc trò chuyện mới</button>
  </main>

  <script>
    const chat = document.querySelector("#chat");
    const form = document.querySelector("#form");
    const input = document.querySelector("#input");
    const send = document.querySelector("#send");
    const status = document.querySelector("#status");
    const reset = document.querySelector("#reset");

    let history = [];

    function addMessage(role, text) {
      const element = document.createElement("div");
      element.className = "message " + role;
      element.textContent =
        (role === "user" ? "Bạn: " : "Gemini: ") + text;

      chat.appendChild(element);
      chat.scrollTop = chat.scrollHeight;
      return element;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text || send.disabled) return;

      const messages = [
        ...history.slice(-38),
        { role: "user", content: text }
      ];

      const bubble = addMessage("user", text);

      input.value = "";
      send.disabled = true;
      reset.disabled = true;
      status.textContent = "Gemini đang trả lời…";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Gửi tin nhắn thất bại.");
        }

        history = [
          ...messages,
          { role: "assistant", content: data.reply }
        ];

        addMessage("assistant", data.reply);
        status.textContent = "";
      } catch (error) {
        bubble.remove();
        input.value = text;
        status.textContent = "Lỗi: " + error.message;
      } finally {
        send.disabled = false;
        reset.disabled = false;
        input.focus();
      }
    });

    reset.addEventListener("click", () => {
      history = [];
      chat.replaceChildren();
      status.textContent = "";
      input.focus();
    });
  </script>
</body>
</html>
